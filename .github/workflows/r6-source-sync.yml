name: R6 Source Sync

on:
  push:
    branches:
      - feature/uicommon-0.1-foundation
    paths:
      - '.sync/r6-full/**'
      - '.github/workflows/r6-source-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/uicommon-0.1-foundation
          fetch-depth: 0

      - name: Reconstruct exact R6 source
        shell: bash
        run: |
          set -euo pipefail

          cat .sync/r6-full/part_*.b64 > /tmp/r6_full.b64
          base64 -d /tmp/r6_full.b64 > /tmp/r6_full.tar.xz
          echo "732a35c810344745fb707c6dd3ac2c4897e150efd51413d24ca890a7bf62a129  /tmp/r6_full.tar.xz" | sha256sum -c -

          TARGET="missions/SP_ORG_Items_Weapons_UI_Lab_SelfContained.VR"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          tar -xJf /tmp/r6_full.tar.xz -C "$TARGET"
          test "$(find "$TARGET" -type f | wc -l)" -eq 432

          rm -rf .sync/r6-full
          rm -f .github/workflows/r6-source-sync.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$TARGET" .sync/r6-full .github/workflows/r6-source-sync.yml
          git commit -m "sync(weapons): materialize exact 0.6-F R6 mission baseline"

          ACTUAL="$(git rev-parse HEAD:"$TARGET")"
          EXPECTED="91dae966c4239b3984d21a24916d8e12f811fd2e"
          echo "R6 subtree: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          git push origin HEAD:feature/uicommon-0.1-foundation
