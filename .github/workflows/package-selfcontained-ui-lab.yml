name: Package self-contained UI lab

on:
  push:
    branches:
      - feature/uicommon-0.1-foundation
      - feature/items-0.13-retomada-20261021
      - feature/items-uicommon-brand-footer-r2-20261021
    paths:
      - "missions/SP_ORG_Items_Weapons_UI_Lab_SelfContained.VR/**"
      - "missions/PACKAGE_MISSION_NAME.txt"
      - ".github/workflows/package-selfcontained-ui-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve mission package identity
        shell: bash
        run: |
          MISSION_NAME="$(tr -d '\r\n' < missions/PACKAGE_MISSION_NAME.txt)"
          if [[ -z "$MISSION_NAME" || "$MISSION_NAME" != *.VR ]]; then
            echo "Invalid mission package name: '$MISSION_NAME'"
            exit 1
          fi
          echo "MISSION_NAME=$MISSION_NAME" >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=${MISSION_NAME%.VR}.zip" >> "$GITHUB_ENV"

      - name: Validate branding asset and footer source invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          addon = Path("addons/ServoPeregrino_Organizador_Items/data/bgd_logo_ca.paa")
          mission = Path("missions/SP_ORG_Items_Weapons_UI_Lab_SelfContained.VR/items/data/bgd_logo_ca.paa")
          assert addon.is_file() and mission.is_file(), "PAA BGD missing"
          assert addon.read_bytes() == mission.read_bytes(), "addon / mission PAA mismatch"
          assert struct.unpack("<H", addon.read_bytes()[:2])[0] == 0xFF05, "BGD PAA is not DXT5"
          root = Path("missions/SP_ORG_Items_Weapons_UI_Lab_SelfContained.VR")
          for rel in ["items/functions/ui/fn_refreshPhysicalTargetUI.sqf","items/functions/ui/fn_refreshHeaderUI.sqf","items/ui/items_dialog.hpp","uicommon/ui/shared_controls.hpp"]:
              m = (root / rel).read_bytes()
              a = (Path("addons/ServoPeregrino_Organizador_"+("UICommon" if rel.startswith("uicommon/") else "Items")) / rel.split("/",1)[1]).read_bytes()
              assert a == m, "mission/addon mismatch: " + rel
          footer = (root/"items/functions/ui/fn_refreshPhysicalTargetUI.sqf").read_text(encoding="utf-8")
          assert '[5002,"HISTÓRICO",_histText,"#B9A3E8","#D1C2F0"' in footer
          assert "ctrlSetStructuredText parseText format [\"<t color='#81918E'>HISTÓRICO" not in footer
          ui = (root/"items/ui/items_dialog.hpp").read_text(encoding="utf-8")
          assert "SPORG_Items_HeaderBrand: SPORG_UICommon_HeaderBrand" in ui
          assert 'text="";' in ui and "FutureIconSlot: SPORG_Items_HeaderBrand" in ui
          assert "SPORG_ITEMS_MISSION_BRAND_TEXTURE" not in ui
          header = (root/"items/functions/ui/fn_refreshHeaderUI.sqf").read_text(encoding="utf-8")
          assert 'getMissionPath "items\\data\\bgd_logo_ca.paa"' in header
          assert 'ctrlSetText _logoPath' in header
          assert '[BRAND_HEADER]' in header
          desc = (root/"description.ext").read_text(encoding="utf-8")
          assert "SPORG_ITEMS_MISSION_BRAND_TEXTURE" not in desc
          print("PASS: PAA DXT5; mirrored addon/mission; purple history; runtime mission path; generic brand")
          PY

      - name: Package mission with delivery-specific name
        shell: bash
        run: |
          rm -rf dist .mission-package
          mkdir -p "dist" ".mission-package/$MISSION_NAME"
          cp -a "missions/SP_ORG_Items_Weapons_UI_Lab_SelfContained.VR/." ".mission-package/$MISSION_NAME/"
          (
            cd .mission-package
            zip -r "../dist/$ARCHIVE_NAME" "$MISSION_NAME"
          )
          rm -rf .mission-package
          sha256sum "dist/$ARCHIVE_NAME" | tee dist/SHA256.txt

      - name: Upload mission artifact
        uses: actions/upload-artifact@v4
        with:
          name: SP_ORG_UI_Lab
          path: dist/
          if-no-files-found: error
          retention-days: 30
